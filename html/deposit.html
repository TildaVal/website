<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrone Bank - Deposit</title>
    <link
      rel="shortcut icon"
      href="/images/apple-icon.png"
      type="image/x-icon"
    />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #0047ab, #ff0000);
        color: white;
        margin: 0;
        padding: 30px;
      }

      .deposit-container {
        background: white;
        color: #222;
        padding: 25px;
        border-radius: 15px;
        max-width: 500px;
        margin: auto;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      h2 {
        text-align: center;
        color: #0047ab;
      }

      label {
        display: block;
        font-weight: bold;
        margin-top: 10px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-top: 5px;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        background: #0047ab;
        color: white;
        border-radius: 25px;
        margin-top: 20px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #002f6d;
      }

      .back-btn {
        background: red;
        margin-top: 10px;
      }

      #depositHeader {
        background: #0047ab;
        color: white;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 15px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="depositHeader">
      <h3>Deposit Funds</h3>
      <p>
        Welcome, <span id="userName"></span> | Balance: £<span
          id="userBalance"
        ></span>
      </p>
    </div>

    <div class="deposit-container">
      <h2>Add Money to Your Account</h2>
      <form id="depositForm">
        <label>Deposit Method</label>
        <select id="method" required>
          <option value="">Select Method</option>
          <option>Bank Transfer</option>
          <option>Credit/Debit Card</option>
          <option>Mobile Payment</option>
          <option>Cash Deposit</option>
        </select>

        <label>Amount (£)</label>
        <input type="number" id="amount" required placeholder="Enter amount" />

        <label>Reference (optional)</label>
        <input type="text" id="reference" placeholder="e.g. Salary, Savings" />

        <button type="submit">Confirm Deposit</button>
        <button type="button" class="back-btn" onclick="goBack()">
          Back to Dashboard
        </button>
      </form>
    </div>
    <!-- Transaction Success Popup -->
    <div
      id="txnSuccessPopup"
      style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: #fff;
        color: #0047ab;
        padding: 30px 40px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        z-index: 1000;
        transition: transform 0.5s ease, opacity 0.5s ease;
      "
    >
      <div style="font-size: 60px; color: green">✅</div>
      <h2 id="txnMessage">Transaction Successful!</h2>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("MetroneUser"));
      if (!user) {
        alert("Session expired. Please log in again.");
        window.location.href = "login.html";
      }

      document.getElementById("userName").textContent = user.name;
      document.getElementById("userBalance").textContent =
        user.balance?.toFixed(2) || "0.00";

      function showSuccessPopup(message, redirectUrl) {
        const popup = document.getElementById("txnSuccessPopup");
        const msg = document.getElementById("txnMessage");
        msg.textContent = message;
        popup.style.display = "block";

        setTimeout(() => {
          popup.style.transform = "translate(-50%, -50%) scale(1)";
          popup.style.opacity = "1";
        }, 50);

        setTimeout(() => {
          popup.style.transform = "translate(-50%, -50%) scale(0)";
          popup.style.opacity = "0";
          setTimeout(() => {
            popup.style.display = "none";
            if (redirectUrl) window.location.href = redirectUrl;
          }, 500);
        }, 2000);
      }

      const form = document.getElementById("depositForm");
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const method = document.getElementById("method").value;
        const amount = parseFloat(document.getElementById("amount").value);
        const reference = document.getElementById("reference").value.trim();

        if (!method || isNaN(amount) || amount <= 0)
          return alert("Please enter a valid amount and method.");

        user.balance = (user.balance || 0) + amount;
        const txn = `💳 Deposited £${amount.toFixed(
          2
        )} via ${method} on ${new Date().toLocaleString()} ${
          reference ? `(${reference})` : ""
        }`;
        user.transactions = user.transactions || [];
        user.transactions.unshift(txn);

        localStorage.setItem("MetroneUser", JSON.stringify(user));

        showSuccessPopup("Deposit Successful!", "dashboard.html");
      });

      function goBack() {
        window.location.href = "dashboard.html";
      }
    </script>
  </body>
</html>
