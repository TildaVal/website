<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrone Bank - Forgot Password</title>
    <link
      rel="shortcut icon"
      href="/images/apple-icon.png"
      type="image/x-icon"
    />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        background: linear-gradient(to right, #0047ab, #ff0000);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #222;
      }

      .reset-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        width: 400px;
        padding: 30px;
        text-align: center;
        transition: all 0.5s ease-in-out;
      }

      h2 {
        color: #0047ab;
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
        display: block;
        margin-top: 10px;
        text-align: left;
        color: #333;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.3s;
      }

      input:focus {
        border-color: #0047ab;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: red;
        color: white;
        border: none;
        border-radius: 25px;
        margin-top: 20px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #b30000;
      }

      .links {
        margin-top: 15px;
        font-size: 0.9rem;
      }

      .links a {
        color: #0047ab;
        text-decoration: none;
        font-weight: bold;
      }

      .links a:hover {
        text-decoration: underline;
      }

      .message {
        margin-top: 15px;
        color: green;
        font-weight: bold;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="reset-container">
      <h2>Reset Your Password</h2>
      <form id="resetForm">
        <label for="email">Enter your registered email</label>
        <input type="email" id="email" required />

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="6" />

        <button type="submit">Reset Password</button>
      </form>

      <p class="message" id="message">
        Your password has been successfully reset! Redirecting...
      </p>

      <div class="links">
        <p>
          Remembered your password? <a href="login.html">Go back to login</a>
        </p>
      </div>
    </div>

    <script>
      const resetForm = document.getElementById("resetForm");
      const message = document.getElementById("message");

      resetForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const emailInput = document.getElementById("email").value.trim();
        const newPassword = document.getElementById("newPassword").value.trim();

        const storedUser = JSON.parse(localStorage.getItem("MetroneUser"));

        if (!storedUser) {
          alert("No account found! Please sign up first.");
          return;
        }

        if (emailInput === storedUser.email) {
          storedUser.password = newPassword;
          localStorage.setItem("MetroneUser", JSON.stringify(storedUser));
          message.style.display = "block";

          setTimeout(() => {
            window.location.href = "login.html";
          }, 2500);
        } else {
          alert("Email not found. Please try again or sign up.");
        }
      });
    </script>
  </body>
</html>
